name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Verify package exports (import + require)
        run: |
          node --input-type=module -e "import('cookie-sentinel').then(m => { if (typeof m.auditUrls !== 'function') process.exit(1); })"
          node -e "const r=require('module').createRequire(require('path').join(process.cwd(),'package.json')); if (typeof r('cookie-sentinel').auditSetCookies !== 'function') process.exit(1)"
      - run: npm pack --dry-run
      - name: Dogfood
        run: |
          printf 'Set-Cookie: __Host-s=1; Secure; HttpOnly; Path=/; SameSite=Lax\n' | node bin/cookie-sentinel.js -i - --fail-on medium
